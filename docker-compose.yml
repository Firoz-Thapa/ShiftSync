services:
  backend:
    build: ./backend
    ports:
      - "3001:80"
    environment:
      ConnectionStrings__Users: "Data Source=/app/data/shiftsync-users.db"
    volumes:
      - shiftsync-data:/app/data
    networks:
      - shiftsync-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shiftsync-network

networks:
  shiftsync-network:
    driver: bridge

volumes:
  shiftsync-data:
